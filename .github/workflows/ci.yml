name: CI

on:
  # Cho phép chạy CI đầu tiên hoặc chạy lại kiểm tra mà không cần tạo commit mới.
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  IMAGE_NAME: enterprise-todo

jobs:
  test:
    name: Test Spring Boot application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        run: mvn -B test

  security:
    name: Scan source and dependencies
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check dependency tree
        working-directory: app
        run: mvn -B dependency:tree

  image:
    name: Build and scan container image
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Calculate immutable image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/enterprise-todo:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --tag "${{ steps.image.outputs.ref }}" app

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "${{ steps.image.outputs.ref }}"
