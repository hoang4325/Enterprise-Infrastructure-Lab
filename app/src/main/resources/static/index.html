<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise Todo</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input { flex: 1; padding: 10px; }
    button { padding: 10px 14px; cursor: pointer; }
    li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #ddd; }
    .done { text-decoration: line-through; color: #777; }
  </style>
</head>
<body>
  <h1>Enterprise Todo</h1>
  <form id="todo-form"><input id="title" required placeholder="Việc cần làm"><button>Thêm</button></form>
  <ul id="todos"></ul>
  <script>
    // Gọi API qua cùng origin để HAProxy/Nginx giữ nguyên luồng bảo mật.
    const list = document.querySelector('#todos');
    async function load() {
      const todos = await fetch('/api/todos').then(response => response.json());
      list.innerHTML = todos.map(todo => `<li><span class="${todo.completed ? 'done' : ''}">${todo.title}</span><button onclick="removeTodo(${todo.id})">Xóa</button></li>`).join('');
    }
    async function removeTodo(id) { await fetch(`/api/todos/${id}`, { method: 'DELETE' }); load(); }
    document.querySelector('#todo-form').addEventListener('submit', async event => {
      event.preventDefault();
      await fetch('/api/todos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: document.querySelector('#title').value }) });
      event.target.reset(); load();
    });
    load();
  </script>
</body>
</html>
