# Package NFS Server
nfs_package: nfs-kernel-server

# Ten dich vu
nfs_service: nfs-kernel-server

# Thu muc chia se
nfs_shared_directory: /srv/nfs/shared

# File exports
nfs_exports_file: /etc/exports

# Chỉ các Web Server được phép mount dữ liệu NFS.
nfs_allowed_clients: "{{ groups['web'] | map('extract', hostvars, 'ansible_host') | list }}"

# Quyen export
nfs_export_options: rw,sync,no_subtree_check

# Virtual disk riêng dùng để lưu backup; chỉ format khi thiết bị chưa có filesystem.
backup_disk_enabled: true
backup_disk_device: /dev/sdb
backup_mount_directory: /srv/backup
backup_filesystem: ext4
backup_mount_options: defaults,nofail

# Export backup chỉ cho MariaDB để database có thể ghi dump vào disk riêng.
backup_allowed_client: 10.10.0.230
backup_export_options: rw,sync,no_subtree_check,root_squash
