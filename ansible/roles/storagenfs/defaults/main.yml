# Package NFS Server
nfs_package: nfs-kernel-server

# Ten dich vu
nfs_service: nfs-kernel-server

# Thu muc chia se
nfs_shared_directory: /srv/nfs/shared

# File exports
nfs_exports_file: /etc/exports

# Chỉ Web Server được phép mount dữ liệu NFS.
nfs_allowed_network: "{{ hostvars[groups['web'][0]].ansible_host }}/32"

# Quyen export
nfs_export_options: rw,sync,no_subtree_check
