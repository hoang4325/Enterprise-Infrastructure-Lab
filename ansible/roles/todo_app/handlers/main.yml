---
# Khởi động lại container khi image hoặc cấu hình ứng dụng thay đổi.
- name: Restart Todo application
  community.docker.docker_compose_v2:
    project_src: "{{ todo_app_directory }}"
    state: present
    build: "{{ 'always' if todo_app_build_image else 'never' }}"
    pull: "{{ 'always' if todo_app_registry_enabled else 'never' }}"
