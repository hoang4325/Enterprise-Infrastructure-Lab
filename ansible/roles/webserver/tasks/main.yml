# Cài đặt Nginx.
- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: true

# Tạo thư mục làm mount point cho dữ liệu dùng chung.
- name: Create Mount Directory
  ansible.builtin.file:
    path: "{{ nfs_mount_directory }}"
    state: directory
    mode: "0755"

# Cài đặt client NFS và client MariaDB để kiểm tra luồng phụ thuộc.
- name: Install NFS Client
  ansible.builtin.apt:
    name:
      - nfs-common
      - mariadb-client
      - python3-pymysql
    state: present

# Kiểm tra NFS Server sẵn sàng trước khi mount.
- name: Wait for NFS Server
  ansible.builtin.wait_for:
    host: "{{ nfs_server }}"
    port: 2049
    timeout: 30

# Mount NFSv4 và lưu vào fstab để tự phục hồi sau khi reboot.
- name: Mount NFS Share
  ansible.posix.mount:
    src: "{{ nfs_server }}:{{ nfs_remote_directory }}"
    path: "{{ nfs_mount_directory }}"
    fstype: nfs
    opts: "{{ nfs_mount_options }}"
    state: mounted

# Xác nhận mount point thực sự là filesystem NFS, không chỉ là thư mục rỗng.
- name: Verify NFS mount is active
  ansible.builtin.command:
    cmd: "mountpoint -q {{ nfs_mount_directory }}"
  changed_when: false

# Kiểm tra firewall và đường mạng từ Web Server đến MariaDB.
- name: Wait for MariaDB TCP port
  ansible.builtin.wait_for:
    host: "{{ mariadb_server }}"
    port: "{{ mariadb_port }}"
    timeout: 30

# Kiểm tra MariaDB thực sự trả lời; không ghi mật khẩu hoặc thông tin nhạy cảm vào log.
- name: Verify MariaDB responds to ping
  ansible.builtin.command:
    cmd: >-
      mysqladmin --protocol=tcp --host={{ mariadb_server }}
      --port={{ mariadb_port }} --connect-timeout=5 ping
  register: mariadb_ping
  changed_when: false
  failed_when:
    - mariadb_ping.rc != 0
    - "'alive' not in ((mariadb_ping.stdout ~ mariadb_ping.stderr) | lower)"
    - "'not allowed' not in ((mariadb_ping.stdout ~ mariadb_ping.stderr) | lower)"

# Khi có secret Vault, kiểm tra thêm khả năng đăng nhập của tài khoản ứng dụng.
- name: Verify Web Server application login to MariaDB
  community.mysql.mysql_query:
    login_host: "{{ mariadb_server }}"
    login_port: "{{ mariadb_port }}"
    login_user: "{{ web_mariadb_application_user }}"
    login_password: "{{ web_mariadb_application_password }}"
    login_db: "{{ web_mariadb_application_database }}"
    query: SELECT 1
  no_log: true
  when: web_mariadb_application_password | string | length > 0

# Triển khai cấu hình Nginx có endpoint health check cho HAProxy.
- name: Deploy Nginx Configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_config_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Nginx

# Khởi động và bật Nginx cùng hệ điều hành.
- name: Enable Nginx Service
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    enabled: true
    state: started

# Thu thập thông tin service để hiển thị kết quả triển khai.
- name: Collect Service Facts
  ansible.builtin.service_facts:

# Thông báo ngắn gọn khi Nginx đang chạy.
- name: Show Nginx Status
  ansible.builtin.debug:
    msg: "Nginx service is running"
  when: ansible_facts.services['nginx.service'].state == "running"

# Kiểm tra phiên bản Nginx nhưng không đánh dấu playbook là changed.
- name: Check Nginx Version
  ansible.builtin.command: nginx -v
  register: nginx_version
  changed_when: false
  failed_when: false

# Hiển thị phiên bản Nginx.
- name: Show Nginx Version
  ansible.builtin.debug:
    msg: "{{ nginx_version.stderr }}"

# Áp dụng ngay cấu hình mới trước khi kiểm tra endpoint health.
- name: Apply pending Nginx handler changes
  ansible.builtin.meta: flush_handlers

# Kiểm tra endpoint nội bộ sau khi Nginx đã khởi động.
- name: Verify Web health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:80{{ webserver_healthcheck_path }}"
    status_code: 200
    return_content: false
