# Cài đặt Node Exporter trên toàn bộ máy chủ để Prometheus thu thập metrics

- name: Configure Node Exporter
  # Triển khai Node Exporter trên toàn bộ máy trong inventory.
  hosts: all
  become: true

# Role này cài exporter trên cả các node nguồn dữ liệu và máy Monitoring.
  roles:
    - node_exporter
